<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
:root{--navy:#16395E;--deep:#0F2A47;--teal:#3FC8BC;--tealD:#13756D;--bg:#F3F6F9;--bg2:#E7EEF5;--card:#FBFCFD;--line:#C5D6E6;--text:#2C3E55;--muted:#5B6B7E;--red:#B42318;--redBg:#FDECEA;--amber:#8A5A00;--amberBg:#FFF4D6;--green:#11734B;--greenBg:#E3F5EC;}
*{box-sizing:border-box}
body{margin:0;font-family:'Be Vietnam Pro',Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45}
button{font-family:inherit;font-size:13px;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--navy);padding:7px 12px;font-weight:600}
button:hover{border-color:var(--navy)}
button.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
button.teal{background:var(--teal);color:var(--deep);border-color:var(--teal)}
button.danger{color:var(--red);border-color:#E9B4AE}
button:disabled{opacity:.45;cursor:not-allowed}
button.on{background:var(--red);color:#fff;border-color:var(--red)}
input,select,textarea{font-family:inherit;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff;color:var(--text);width:100%}
textarea{resize:vertical}
header{background:var(--deep);color:#EEF3F8;padding:10px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header .brand{font-weight:700;font-size:16px}
header .brand small{display:block;font-weight:400;font-size:12px;color:#A9C0D6}
.roles{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.roles button{background:transparent;color:#C5D6E6;border-color:#2E5379}
.roles button.act{background:var(--teal);color:var(--deep);border-color:var(--teal)}
.who{font-size:12px;color:#A9C0D6}
.banner{background:var(--amberBg);color:var(--amber);padding:8px 20px;font-size:13px;border-bottom:1px solid #F0D58A}
main{padding:18px 20px 40px;max-width:1500px;margin:0 auto}
.grid{display:grid;grid-template-columns:330px minmax(0,1fr);gap:18px;align-items:start}.grid>*,.two>*{min-width:0}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.card h3{margin:0 0 10px;font-size:15px;color:var(--navy)}
.card h2{margin:0 0 4px;font-size:19px;color:var(--navy)}
.sub{color:var(--muted);font-size:12.5px}
.q{display:flex;flex-direction:column;gap:8px}
.qi{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;cursor:pointer}
.qi.sel{border-color:var(--navy);box-shadow:0 0 0 2px var(--navy) inset}
.qi .n{font-weight:600;color:var(--navy)}
.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:20px;margin:2px 4px 0 0;background:var(--bg2);color:var(--navy)}
.chip.red{background:var(--redBg);color:var(--red)}
.chip.amber{background:var(--amberBg);color:var(--amber)}
.chip.green{background:var(--greenBg);color:var(--green)}
.chip.teal{background:#DDF5F2;color:var(--tealD)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sec{border-top:1px solid var(--bg2);padding-top:14px;margin-top:14px}
.vit{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:700px){.vit{grid-template-columns:repeat(2,1fr)}}
.vit label{font-size:12px;color:var(--muted);display:block;margin-bottom:3px}
.vit .bad input{border-color:var(--red);background:var(--redBg)}
.alert{border-radius:10px;padding:10px 12px;margin:8px 0;font-size:13.5px}
.alert.red{background:var(--redBg);color:var(--red);border:1px solid #F1B8B1}
.alert.amber{background:var(--amberBg);color:var(--amber);border:1px solid #F0D58A}
.alert.green{background:var(--greenBg);color:var(--green);border:1px solid #A9DCC3}
.alert.info{background:var(--bg2);color:var(--navy);border:1px solid var(--line)}
.tr{font-family:inherit;min-height:220px;line-height:1.6}
.partial{color:var(--muted);font-style:italic;min-height:20px;font-size:13px}
.soap{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:1100px){.soap{grid-template-columns:1fr}}
.sblock{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff}
.sblock h4{margin:0 0 8px;color:var(--navy);font-size:14px}
.item{border-left:3px solid var(--line);padding:6px 0 8px 10px;margin-bottom:8px}
.item.ok{border-left-color:var(--teal)}
.item.near{border-left-color:#E0B341}
.item.bad{border-left-color:var(--red);background:var(--redBg);border-radius:0 8px 8px 0;padding-right:8px}
.item textarea{min-height:38px;font-size:13.5px}
.ev{font-size:12px;color:var(--muted);margin-top:4px}
.ev q{font-style:italic}
table{border-collapse:collapse;width:100%;font-size:13px}
th{background:var(--navy);color:#fff;text-align:left;padding:7px 8px;font-weight:600}
td{border-bottom:1px solid var(--bg2);padding:6px 8px;vertical-align:top}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi b{display:block;font-size:26px;color:var(--navy)}
.kpi span{font-size:12.5px;color:var(--muted)}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabs button.act{background:var(--navy);color:#fff}
pre{background:#0F2A47;color:#DDF5F2;padding:12px;border-radius:10px;overflow:auto;max-height:420px;font-size:12px}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.steps span{font-size:12px;padding:4px 10px;border-radius:20px;background:var(--bg2);color:var(--muted)}
.steps span.done{background:#DDF5F2;color:var(--tealD)}
.steps span.cur{background:var(--navy);color:#fff}
.mt{margin-top:10px}.mt2{margin-top:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:1000px){.two{grid-template-columns:1fr}}
#toast{position:fixed;right:18px;bottom:18px;background:var(--deep);color:#fff;padding:10px 16px;border-radius:10px;display:none;max-width:420px;z-index:9;font-size:13.5px}
.form dt{font-weight:600;color:var(--navy);margin-top:8px}
.form dd{margin:2px 0 0 0;white-space:pre-wrap}
.muted{color:var(--muted)}
label.ck{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;margin:6px 0}
label.ck input{width:auto;margin-top:3px}

<script type="text/plain" id="bridgeSrc">
#!/usr/bin/env python3
"""
fhir_bridge.py – Cầu nối gửi FHIR R4 Bundle từ demo AI SOAP Scribe tới một FHIR server thật.

Vì sao cần cầu nối: trang demo chạy trong khung bảo mật của trình duyệt nên không được gọi
trực tiếp ra máy chủ ngoài. Khi triển khai thật, việc này cũng do lớp tích hợp phía bệnh viện
(cổng HIS / integration engine) đảm nhận, không phải trình duyệt của bác sĩ.

Chỉ dùng thư viện chuẩn Python 3.8+. Không cần cài thêm gói.

Ví dụ:
  python fhir_bridge.py BN002_transaction.json --validate --confirm-demo-data
  python fhir_bridge.py BN002_transaction.json --base http://localhost:8080/fhir --validate
  python fhir_bridge.py BN002_transaction.json --base https://fhir.benhvien.vn/r4 --token <BEARER>
  python fhir_bridge.py BN002_fhir_bundle.json --validate --confirm-demo-data   (lưu document Bundle vào /Bundle)

Kết quả: in trạng thái từng tài nguyên và ghi file <tên>_response.json để dán ngược vào ứng dụng demo.
"""
import argparse
import json
import sys
import urllib.error
import urllib.request
from urllib.parse import urlparse

PUBLIC_SANDBOXES = ("hapi.fhir.org", "server.fire.ly", "r4.smarthealthit.org")
DEMO_ID_PREFIX = "urn:demo:"


def http(method, url, body=None, token=None, timeout=60):
    data = json.dumps(body).encode("utf-8") if body is not None else None
    req = urllib.request.Request(url, data=data, method=method)
    req.add_header("Accept", "application/fhir+json")
    if data is not None:
        req.add_header("Content-Type", "application/fhir+json; charset=utf-8")
    if token:
        req.add_header("Authorization", "Bearer " + token)
    try:
        with urllib.request.urlopen(req, timeout=timeout) as r:
            raw = r.read().decode("utf-8")
            return r.status, (json.loads(raw) if raw else None)
    except urllib.error.HTTPError as e:
        raw = e.read().decode("utf-8", "replace")
        try:
            return e.code, json.loads(raw)
        except ValueError:
            return e.code, {"resourceType": "OperationOutcome",
                            "issue": [{"severity": "error", "code": "exception", "diagnostics": raw[:500]}]}
    except (urllib.error.URLError, ConnectionError, TimeoutError) as e:
        sys.exit(f"Không kết nối được {url}: {getattr(e, 'reason', e)}")


def only_demo_data(bundle):
    """Đúng nếu mọi Patient trong bundle chỉ mang định danh giả lập (urn:demo:...)."""
    for e in bundle.get("entry", []):
        r = e.get("resource", {})
        if r.get("resourceType") == "Patient":
            ids = r.get("identifier", [])
            if not ids or not all(str(i.get("system", "")).startswith(DEMO_ID_PREFIX) for i in ids):
                return False
    return True


def print_outcome(oo, title):
    issues = (oo or {}).get("issue", [])
    counts = {}
    for i in issues:
        counts[i.get("severity", "?")] = counts.get(i.get("severity", "?"), 0) + 1
    print(f"\n== {title}: " + (", ".join(f"{k}={v}" for k, v in counts.items()) or "không có issue"))
    for i in issues:
        if i.get("severity") in ("fatal", "error", "warning"):
            loc = ",".join(i.get("expression", []) or i.get("location", []) or [])
            print(f"  [{i.get('severity')}] {loc} {i.get('diagnostics', '')[:300]}")
    return counts


def main():
    ap = argparse.ArgumentParser(description="Gửi FHIR R4 transaction Bundle tới FHIR server")
    ap.add_argument("bundle", help="File JSON Bundle xuất từ ứng dụng demo: type=transaction (tạo từng tài nguyên) hoặc type=document (lưu nguyên văn bản ký vào /Bundle)")
    ap.add_argument("--base", default="https://hapi.fhir.org/baseR4", help="FHIR base URL")
    ap.add_argument("--token", help="Bearer token nếu server yêu cầu (SMART/OAuth2)")
    ap.add_argument("--validate", action="store_true", help="Gọi Bundle/$validate trước khi gửi")
    ap.add_argument("--confirm-demo-data", action="store_true",
                    help="Bắt buộc khi gửi lên sandbox CÔNG KHAI: xác nhận chỉ là dữ liệu giả lập")
    ap.add_argument("--out", help="File ghi phản hồi (mặc định <bundle>_response.json)")
    a = ap.parse_args()

    with open(a.bundle, encoding="utf-8") as f:
        bundle = json.load(f)
    kind = bundle.get("type")
    if bundle.get("resourceType") != "Bundle" or kind not in ("transaction", "batch", "document"):
        sys.exit("Lỗi: file phải là Bundle type=transaction, batch hoặc document.")

    base = a.base.rstrip("/")
    host = urlparse(base).hostname or ""
    if any(host.endswith(h) for h in PUBLIC_SANDBOXES):
        print(f"CẢNH BÁO: {host} là sandbox CÔNG KHAI – ai cũng đọc được dữ liệu gửi lên, server có thể xóa định kỳ.")
        if not a.confirm_demo_data:
            sys.exit("Dừng: thêm --confirm-demo-data để xác nhận đây chỉ là dữ liệu giả lập.")
        if not only_demo_data(bundle):
            sys.exit("Dừng: Patient không mang định danh giả lập (urn:demo:...). Không gửi dữ liệu thật lên sandbox công khai.")

    st, meta = http("GET", base + "/metadata", token=a.token, timeout=30)
    if st != 200 or (meta or {}).get("resourceType") != "CapabilityStatement":
        sys.exit(f"Không đọc được CapabilityStatement từ {base} (HTTP {st}).")
    print(f"Server: {(meta.get('software') or {}).get('name', '?')} {(meta.get('software') or {}).get('version', '')}"
          f" · FHIR {meta.get('fhirVersion', '?')}")

    if a.validate:
        st, oo = http("POST", base + "/Bundle/$validate", bundle, a.token)
        counts = print_outcome(oo, f"Bundle/$validate (HTTP {st})")
        if counts.get("fatal") or counts.get("error"):
            print("Có lỗi validation. Vẫn gửi để xem server xử lý thế nào; hãy sửa trước khi dùng thật.")

    st, resp = http("POST", base + ("/Bundle" if kind == "document" else ""), bundle, a.token)
    out = a.out or a.bundle.rsplit(".", 1)[0] + "_response.json"
    with open(out, "w", encoding="utf-8") as f:
        json.dump(resp, f, ensure_ascii=False, indent=2)

    if st >= 300 or (resp or {}).get("resourceType") != "Bundle":
        print_outcome(resp, f"Gửi thất bại (HTTP {st})")
        print(f"Đã ghi phản hồi: {out}")
        sys.exit(1)

    if kind == "document":
        print(f"\n== Đã lưu document Bundle (HTTP {st}): {base}/Bundle/{resp.get('id', '?')}")
        return

    print(f"\n== Transaction thành công (HTTP {st}) – {len(resp.get('entry', []))} tài nguyên")
    for e in resp.get("entry", []):
        r = e.get("response", {})
        loc = r.get("location", "")
        print(f"  {r.get('status', ''):<14} {base}/{loc.split('/_history')[0] if loc else ''}")
    print(f"\nĐã ghi phản hồi: {out}  → mở ứng dụng demo, mục FHIR, bấm 'Dán phản hồi server' và dán nội dung file này.")


if __name__ == "__main__":
    main()
</script>

SCRIPTS.BN005=`BS: Bác đau khớp gối lâu chưa?

BS: Sáng ngủ dậy gối có cứng không?
BN: Có, cứng khoảng mười lăm phút rồi đỡ.
BS: Bác có dùng thuốc giảm đau gì không?
BN: Tôi có uống ibuprofen hồi trước nhưng bị đau dạ dày, đi ngoài phân đen nên thôi.
BS: Khám thấy gối phải lạo xạo khi cử động, không sưng nóng đỏ, hạn chế gấp gối nhẹ.

BS: Tôi kê paracetamol 500 mg ngày ba lần khi đau, thêm meloxicam 7,5 mg mỗi tối trong năm ngày.

const ICD_KW=[[/tăng huyết áp/,"I10"],[/viêm họng/,"J02.9"],[/hô hấp trên/,"J06.9"],[/thoái hóa khớp gối/,"M17.9"],[/viêm dạ dày/,"K29.7"],[/trào ngược/,"K21.9"],[/viêm phổi/,"J18.9"],[/(^|\s)hen(\s|$|,)/,"J45.9"],[/mỡ máu|lipid/,"E78.5"],[/suy tim/,"I50.9"],[/tiết niệu/,"N39.0"],[/đau thắt lưng/,"M54.5"],[/viêm mũi dị ứng/,"J30.4"],[/mày đay/,"L50.9"],[/ruột thừa/,"K35.8"],[/béo phì/,"E66.9"],[/xơ vữa/,"I25.1"]];
function guessIcd(text){const t=text.toLowerCase();if(/đái tháo đường|tiểu đường|đtđ/.test(t))return /thần kinh/.test(t)?"E11.4":"E11.9";const h=ICD_KW.find(([r])=>r.test(t));return h?h[1]:"";}
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const evOf=s=>s.trim().split(/\s+/).slice(0,12).join(" ");
const PRON="(bác|anh|chị|cháu|em|ông|bà|bệnh nhân|bn|người bệnh)";
function localSoap(p){const raw=p.transcript.split(/\n+/).map(l=>l.trim()).filter(Boolean);const o={S:[],O:[],A:[],P:[],missing:[]};
 const add=(k,text,ev,icd)=>{text=cap(String(text).trim());if(!text)return;const it={text,evidence:ev};if(k==="A")it.icd10=icd!=null?icd:guessIcd(text);o[k].push(it);};
 const hv=Object.values(p.vitals).some(x=>x!==""&&x!=null&&x!==false);
 if(raw.filter(l=>/^[SOAP]\s*[:：]/i.test(l)).length>=2){o.mode="struct";
  raw.forEach(l=>{const m=l.match(/^([SOAP])\s*[:：]\s*(.*)$/i);if(!m)return;const k=m[1].toUpperCase();let txt=m[2].trim();let icd=null;
   if(k==="A"){const c=txt.match(/[\[(]\s*(?:ICD(?:-10)?\s*[:：]?\s*)?([A-Z]\d{2}(?:\.\d{1,2})?)\s*[\])]/i);if(c){icd=c[1].toUpperCase();txt=txt.replace(c[0],"").trim();}txt=txt.replace(/\[\s*ICD-10\s*\]/i,"").trim();}
   if(txt)add(k,txt,evOf(m[2]),icd);});}
 else{o.mode="dialog";let lastQ="";
  raw.forEach(l=>{const m=l.match(/^(BS \(tóm tắt\)|BS|BN|Bác sĩ|Người bệnh|NB)\s*[:：]\s*(.*)$/i);const who=m&&/^(BN|Người bệnh|NB)$/i.test(m[1])?"BN":"BS";const txt=(m?m[2]:l).trim();if(!txt)return;
   if(who==="BN"){if(txt.split(/\s+/).length<6&&lastQ)add("S",lastQ.replace(/\?\s*$/,"")+" → "+txt,evOf(txt));else add("S",txt.replace(/^(dạ|vâng)[,\s]+(đúng rồi[^,.]*[,.]\s*)?/i,""),evOf(txt));lastQ="";return;}
   if(/\?\s*$/.test(txt)){lastQ=txt;return;}lastQ="";const low=txt.toLowerCase();
   if(/^(khám thấy|khám|kết quả|nghe)/.test(low)||/kết quả .* (là|cho thấy)/.test(low))add("O",txt.replace(/^khám thấy\s*/i,""),evOf(txt));
   else if(new RegExp("^"+PRON+"\\s+(bị|mắc)\\s","i").test(txt)||/chẩn đoán|nghĩ nhiều đến/.test(low))add("A",txt.replace(new RegExp("^"+PRON+"\\s+(bị|mắc)\\s+","i"),"").replace(/^chẩn đoán( là)?\s*/i,""),evOf(txt));
   else if(/kê |tăng .+ lên|giảm liều|giữ |tiếp tục|^cho |cho làm|xét nghiệm|chụp|tái khám|hẹn|uống|súc|ăn |hạn chế|đi bộ|tập |nếu .+ thì|quay lại|đến viện|rửa mũi|kháng sinh|nghỉ ngơi|theo dõi|đo huyết áp/.test(low))add("P",txt.replace(/^tôi\s+/i,""),evOf(txt));
   else add("O",txt,evOf(txt));});
  if(hv)o.O.unshift({text:"Sinh hiệu theo điều dưỡng (xem phần sinh hiệu).",evidence:"SINH_HIEU"});}
 const all=norm(p.transcript);
 if(!/dị ứng/.test(all))o.missing.push("Chưa hỏi tiền sử dị ứng thuốc");
 if(!/tái khám|hẹn/.test(all))o.missing.push("Chưa ghi hẹn tái khám cụ thể");
 if(!o.A.length)o.missing.push("Chưa có chẩn đoán");
 if(/liều theo cân nặng/.test(all))o.missing.push("Chưa ghi liều cụ thể theo cân nặng");
 o.A.forEach(a=>{if(!a.icd10)o.missing.push("Chưa xác định mã ICD-10: "+a.text.slice(0,50));});
 return o;}

function vitCalc(p){const n=news2(p),ab=abnormal(p),b=bmi(p);let h="";
 if(b)h+=`<div class="alert info">BMI: <b>${b}</b> kg/m² ${b>=25?T("(thừa cân theo ngưỡng châu Á – Thái Bình Dương của WHO)","(overweight by the WHO Asia-Pacific cut-off)"):b<18.5?T("(thiếu cân)","(underweight)"):""}</div>`;
 ab.forEach(a=>h+=`<div class="alert ${a[0]}">${a[1]}</div>`);
 if(age(p)<16)h+=`<div class="alert info">${T("NEWS2 không áp dụng cho trẻ dưới 16 tuổi. Dùng thang cảnh báo nhi (PEWS) theo quy trình bệnh viện.","NEWS2 does not apply under 16 years. Use the pediatric early warning score (PEWS) per hospital protocol.")}</div>`;
 else if(n)h+=`<div class="alert ${n.score>=7?"red":n.score>=5?"amber":"info"}">NEWS2 = <b>${n.score}</b> · ${T("nguy cơ","risk")} ${n.level}<div class="sub">${n.parts.map(x=>x[0]+": "+x[1]).join(" · ")}</div><div class="sub">${T("Tham chiếu RCP 2017 (thang SpO2 số 1). Ngưỡng xử trí phải theo quy trình bệnh viện đã ban hành.","Reference: RCP 2017 (SpO2 scale 1). Response thresholds must follow the hospital's approved protocol.")}</div></div>`;
 return h;}

function ntResult(n){const r=n.result;const items=[];r.phieu.forEach(i=>items.push(i));Object.values(r.sbar).forEach(a=>a.forEach(i=>items.push(i)));const bad=items.filter(i=>i.v==="bad").length;const dis=n.signedAt?"disabled":"";

 <div class="sec">${bad?`<div class="alert red">${T("Còn ","")}${bad}${T(" mục chưa có căn cứ: xác nhận hoặc xóa trước khi ký."," item(s) without evidence: confirm or delete before signing.")}</div>`:""}
 ${n.signedAt?`<div class="alert green">${T("Điều dưỡng đã xác nhận lúc ","Nurse confirmed at ")}${n.signedAt}${n.signedBy?" · "+esc(n.signedBy):""}. ${T("Phiếu đã lưu vào bệnh án điện tử (mô phỏng).","Saved to the electronic medical record (simulated).")}</div>`:`<button class="primary" data-a="signNT" ${bad?"disabled":""}>${T("Điều dưỡng xác nhận & lưu","Nurse confirm & save")}</button>`}</div>`;}

function vDoctor(){const all=S.patients.filter(p=>p.status!=="Chờ sinh hiệu");const list=all.filter(inScope);const hidden=all.length-list.length;
 if(S.selD&&!list.some(x=>x.id===S.selD))S.selD=null;if(!S.selD&&list.length)S.selD=sortQ(list)[0].id;const p=S.selD?P(S.selD):null;

 return `<div class="grid"><div class="card"><h3>${T("Danh sách chờ khám","Waiting list")} (${list.filter(x=>x.status==="Chờ khám").length})</h3>
 <div class="sub" style="margin-bottom:8px">${T("Phạm vi","Scope")}: ${S.breakGlass?`<b style="color:var(--red)">${T("toàn bệnh viện (khẩn cấp)","whole hospital (break-glass)")}</b>`:esc((S.user.depts||[]).map(dn).join(", ")||"–")}${hidden?` · ${hidden} ${T("người bệnh khoa khác đã ẩn","patient(s) from other departments hidden")}`:""}</div>
 ${list.length?`<div class="q">${sortQ(list).map(x=>qItem(x,x.id===S.selD,"selD")).join("")}</div>`:`<div class="sub">${T("Chưa có người bệnh thuộc phạm vi của bạn được điều dưỡng chuyển vào. Đăng xuất và đăng nhập tài khoản điều dưỡng <b>dd.hoa</b> để nhập sinh hiệu (\"Điền ví dụ câu đọc\" → \"Tách số liệu\" → đồng ý ghi âm → lưu).","No patients in your scope have been sent by nursing yet. Sign out and sign in as nurse <b>dd.hoa</b> to enter vitals (\"Fill sample phrase\" → \"Parse values\" → consent → save).")}</div>`}
 <div class="mt">${bg}</div></div>

function stepBar(p){const st=[T("Hội thoại","Conversation"),T("Bản nháp SOAP","SOAP draft"),T("Duyệt & ký","Review & sign"),T("Lưu HIS","Save to HIS")];const cur=p.status==="Đã lưu HIS"?4:p.soap?2:p.transcript?1:0;return `<div class="steps">${st.map((s,i)=>`<span class="${i<cur?"done":i===cur?"cur":""}">${i+1}. ${s}</span>`).join("")}</div>`;}

 const vit=`${T("Mạch","Pulse")} ${v.hr||"–"} · ${T("HA","BP")} ${v.sbp||"–"}/${v.dbp||"–"} · T ${v.temp||"–"}°C · SpO2 ${v.spo2||"–"}% · ${T("NT","RR")} ${v.rr||"–"} · ${v.weight||"–"} kg${bmi(p)?" · BMI "+bmi(p):""}`;
 return `<h2>${esc(p.name)} <span class="sub">· ${p.id}</span></h2><div class="sub">${p.year} (${age(p)} ${T("tuổi","y")}) · ${sexL(p.sex)} · ${esc(dn(p.dept))} · ${T("Lý do","Reason")}: ${esc(reasonL(p))}</div>
 <div>${priority(p).map(r=>`<span class="chip amber">${T("Ưu tiên","Priority")}: ${r}</span>`).join("")}${p.allergies.map(a=>`<span class="chip red">${T("Dị ứng","Allergy")} ${esc(a.agent)}: ${esc(a.reaction)}</span>`).join("")}${p.allergies.length?"":`<span class="chip">${T("Chưa ghi nhận dị ứng","No allergies recorded")}</span>`}</div>
 <div class="alert info mt">${T("Sinh hiệu (ĐD)","Vitals (nurse)")}: ${vit}${n?` · NEWS2 ${n.score} (${n.level})`:""}</div>${abnormal(p).map(a=>`<div class="alert ${a[0]}">${a[1]}</div>`).join("")}
 ${stepBar(p)}

 return `<div class="sec"><h3>${T("1. Hội thoại khám","1. Consultation conversation")}</h3>

 ${SCRIPTS[p.id]&&!refused?`<button data-a="playScript">${T("▶ Phát hội thoại mẫu","▶ Play sample conversation")}</button>`:""}<button data-a="clearTr" class="danger">${T("Xóa","Clear")}</button></div>
 <div class="row mt"><label class="sub">${T("Mẫu test","Test template")}:</label><select data-a="tpl" style="width:auto;max-width:100%"><option value="">${T("— Chọn mẫu hội thoại / cấu trúc SOAP —","— Choose dialogue / SOAP structure —")}</option>${TPL.map(([k,l])=>`<option value="${k}">${esc(tx(l))}</option>`).join("")}</select></div>
 <div class="sub">${T("Hai định dạng được nhận: hội thoại dòng <code>BS:</code> / <code>BN:</code>, hoặc cấu trúc dòng <code>S:</code> <code>O:</code> <code>A:</code> <code>P:</code> (mã ICD-10 ghi trong ngoặc vuông, ví dụ <code>[I10]</code>).","Two formats accepted: dialogue lines <code>BS:</code> / <code>BN:</code>, or structured lines <code>S:</code> <code>O:</code> <code>A:</code> <code>P:</code> (ICD-10 code in square brackets, e.g. <code>[I10]</code>).")}</div>
 ${S.dictFor==="doc"?`<div class="partial">${esc(S.partial)}</div>`:""}
 <textarea id="tr" class="tr mt" placeholder="BS: …&#10;BN: …">${esc(p.transcript)}</textarea>
 <div class="row mt"><button class="teal" data-a="genSoap" ${S.busy?"disabled":""}>${S.busy?T("Đang tạo bản nháp…","Generating draft…"):T("✦ Tạo bản nháp SOAP","✦ Generate SOAP draft")}</button>
 <select data-a="aimode" style="width:auto"><option value="auto" ${S.aiMode==="auto"?"selected":""}>${T("AI: Claude (khi khả dụng)","AI: Claude (when available)")}</option><option value="offline" ${S.aiMode==="offline"?"selected":""}>${T("Offline: dựng sẵn + tách cấu trúc cục bộ","Offline: prebuilt + local structured parser")}</option></select>
 <span class="sub">${AI?T("AI sẵn sàng","AI ready"):STANDALONE?T("POC Local: hội thoại mẫu gốc dùng kết quả dựng sẵn; hội thoại đã sửa, tự gõ hoặc mẫu S/O/A/P dùng bộ tách cấu trúc cục bộ (quy tắc, không phải AI).","POC Local: unedited samples use prebuilt results; edited, typed or S/O/A/P input uses the local structured parser (rules, not AI)."):T("AI chưa sẵn sàng · sẽ dùng kết quả dựng sẵn cho hội thoại mẫu","AI not ready · prebuilt results will be used for sample conversations")}</span></div></div>
 ${p.soap?soapEditor(p):""}`;}
function soapEditor(p){const s=p.soap;const items=["S","O","A","P"].flatMap(k=>s[k]);const bad=items.filter(i=>i.v==="bad").length;const al=allergyAlerts(p);const icdOK=s.A.length&&s.A.every(i=>icdInfo(i.icd10).ok);const mayS=can("note.sign");
 const names={S:T("S · Chủ quan (bệnh sử, triệu chứng)","S · Subjective (history, symptoms)"),O:T("O · Khách quan (sinh hiệu, khám, cận lâm sàng)","O · Objective (vitals, exam, investigations)"),A:T("A · Đánh giá (chẩn đoán)","A · Assessment (diagnosis)"),P:T("P · Kế hoạch (chỉ định, thuốc, hẹn)","P · Plan (orders, medication, follow-up)")};
 const row=(k,i,j)=>{const ic=k==="A"?icdInfo(i.icd10):null;return `<div class="item ${i.v}"><textarea data-soap="${k}.${j}">${esc(i.text)}</textarea>

 <div class="ev">${evBadge(i)} ${i.evidence&&i.evidence!=="SINH_HIEU"?`${T("Căn cứ","Evidence")}: <q>${esc(i.evidence)}</q>`:i.evidence==="SINH_HIEU"?T("Căn cứ: sinh hiệu điều dưỡng nhập","Evidence: nurse-entered vitals"):""}
 ${i.v==="bad"?`<button data-a="confirmIt" data-v="${k}.${j}">${T("Xác nhận đúng","Confirm")}</button> <button class="danger" data-a="delIt" data-v="${k}.${j}">${T("Xóa","Delete")}</button>`:""}</div></div>`;};
 return `<div class="sec"><div class="row" style="justify-content:space-between"><h3 style="margin:0">${/cục bộ|Local/i.test(p.aiSource||"")?T("2. Bản nháp tự động (tách cục bộ, không phải AI): bác sĩ đọc và sửa","2. Automatic draft (local parser, not AI): physician reviews and edits"):T("2. Bản nháp do AI tạo: bác sĩ đọc và sửa","2. AI-generated draft: physician reviews and edits")}</h3><div class="row"><button data-a="view" data-v="soap" class="${S.soapView==="soap"?"primary":""}">${T("Theo SOAP","SOAP view")}</button><button data-a="view" data-v="form" class="${S.soapView==="form"?"primary":""}">${T("Theo mẫu bệnh án ngoại trú","Outpatient record form")}</button></div></div>
 <div class="sub mt">${T("Nguồn","Source")}: ${esc(p.aiSource||"")} · ${T("Tạo lúc","Created at")} ${p.draftAtStr||""}. ${T("Mỗi dòng được đối chiếu tự động với hội thoại; dòng đỏ là thông tin AI đưa ra mà không tìm thấy trong hội thoại.","Each line is automatically matched against the conversation; red lines are AI statements not found in the conversation.")}</div>

 ${s.missing&&s.missing.length?`<div class="alert amber"><b>${T("Thông tin bệnh án còn thiếu","Missing record information")}:</b> ${s.missing.map(esc).join("; ")}</div>`:""}
 ${S.soapView==="soap"?`<div class="soap mt">${["S","O","A","P"].map(k=>`<div class="sblock"><h4>${names[k]}</h4>${s[k].map((i,j)=>row(k,i,j)).join("")}<button data-a="addIt" data-v="${k}">${T("+ Thêm dòng","+ Add line")}</button></div>`).join("")}</div>`:formView(p)}

   const bad=["S","O","A","P"].flatMap(k=>p.soap[k]).filter(i=>i.v==="bad").length;log(B("Tạo bản nháp SOAP (AI)","SOAP draft generated (AI)"),src+bgTag,p.id);if(bad)log(B("Phát hiện dòng không căn cứ","Unsupported lines detected"),String(bad),p.id);if(allergyAlerts(p).length)log(B("Cảnh báo dị ứng","Allergy alert"),allergyAlerts(p).map(x=>x.drug||x.reaction).join("; "),p.id);render();return;}
  if(a==="confirmIt"||a==="delIt"){const [k,j]=v.split(".");const it=p.soap[k][+j];if(a==="confirmIt"){it.confirmed=true;it.v="ok";log(B("BS xác nhận dòng không căn cứ","Physician confirmed unsupported line"),it.text,p.id);}else{log(B("BS xóa dòng không căn cứ","Physician deleted unsupported line"),it.text,p.id);p.soap[k].splice(+j,1);}render();return;}
  if(a==="addIt"){p.soap[v].push({text:"",evidence:"",icd10:v==="A"?"":undefined,confirmed:true,v:"ok"});render();return;}
  if(a==="ack"){p.alertAck=el.checked;if(el.checked&&!($("#ackr").value||"").trim()){p.alertAck=false;el.checked=false;toast(T("Ghi lý do hoặc thuốc thay thế trước.","Enter the reason or alternative drug first."));return;}p.alertReason=$("#ackr").value;log(B("Xử lý cảnh báo dị ứng","Allergy alert handled"),p.alertReason,p.id);render();return;}
  if(a==="sign"){if(!need("note.sign"))return;if(!$("#resp").checked){toast(T("Cần xác nhận trách nhiệm chuyên môn.","Confirm professional responsibility."));return;}if($("#pin").value!=="1234"){log(B("Ký số thất bại","E-signature failed"),B("Sai PIN","Wrong PIN"),p.id);toast(T("PIN không đúng (demo: 1234).","Wrong PIN (demo: 1234)."));return;}
   const ratio=lev(norm(p.soapOrig),norm(soapText(p.soap)))/Math.max(1,norm(p.soapOrig).length);p.editClass=ratio<0.02?"Không sửa":ratio<0.15?"Sửa nhỏ":"Sửa nhiều";
   p.signedAt=Date.now();p.signedAtStr=tnow();p.signedBy=S.user.name;p.signedById=S.user.staffId;p.fhir=buildFhir(p);el.disabled=true;el.textContent=T("Đang gửi HIS…","Sending to HIS…");
   await new Promise(r=>setTimeout(r,700));p.hisId="HIS-"+new Date().toISOString().slice(0,10).replace(/-/g,"")+"-"+Math.floor(1e5+Math.random()*9e5);
   const h=await sha256(p.transcript);p.trLen=p.transcript.length;p.trHash=h;p.transcript="";
   p.status="Đã lưu HIS";S.soapView="soap";log(B("Ký số ghi chú & gửi HIS","Note e-signed & sent to HIS"),`${p.hisId} · ${editL(p.editClass)} · ${Math.round((p.signedAt-p.draftAt)/1000)} s${bgTag}`,p.id);log(B("Xóa bản ghi hội thoại","Transcript deleted"),"SHA-256 "+h,p.id);toast(T("Đã ký và lưu vào HIS: ","Signed and saved to HIS: ")+p.hisId);render();return;}
  if(["dlTx","copyTx","sendDirect","parseResp","copyFhir","dlFhir","dlBridge","copyBridge","copyCmd"].includes(a)&&!need("fhir.export"))return;
  if(a==="dlTx"){saveFile(p.id+"_transaction.json",JSON.stringify(buildTx(p),null,2));log(B("Xuất transaction Bundle","Transaction Bundle exported"),"",p.id);return;}
  if(a==="dlBridge"){saveFile("fhir_bridge.py",$("#bridgeSrc").textContent.trimStart());return;}
  if(a==="copyTx"){copy(JSON.stringify(buildTx(p),null,2));log(B("Xuất transaction Bundle","Transaction Bundle exported"),"copy",p.id);return;}
  if(a==="copyBridge"){copy($("#bridgeSrc").textContent.trimStart());return;}
  if(a==="copyCmd"){copy(bridgeCmd(p));return;}
  if(a==="sendDirect"){sendDirect(p);return;}
  if(a==="parseResp"){parseResp(p,$("#fresp").value);return;}
  if(a==="copyFhir"){copy(JSON.stringify(p.fhir,null,2));return;}
  if(a==="dlFhir"){saveFile(p.id+"_fhir_bundle.json",JSON.stringify(p.fhir,null,2));log(B("Tải FHIR Bundle","FHIR Bundle downloaded"),"",p.id);return;}}
 // Tuân thủ
 if(S.view==="ops"){
  if(a==="copyAudit"){if(!need("audit.view"))return;copy(JSON.stringify(S.audit,null,2));return;}
  if(a==="dlAudit"){if(!need("audit.view"))return;saveFile("nhat_ky_kiem_toan.json",JSON.stringify(S.audit,null,2));log(B("Xuất nhật ký kiểm toán","Audit trail exported"),"","","admin");return;}}
 // Quản trị
 if(S.view==="admin"){if(!need("users.manage"))return;
  if(a==="setRole"){const acc=S.accounts.find(x=>x.u===el.dataset.u),r=el.dataset.r;if(!acc)return;if(acc.u===S.user.u&&r==="admin"){el.checked=true;return;}
   if(el.checked){if(!acc.roles.includes(r))acc.roles.push(r);}else acc.roles=acc.roles.filter(x=>x!==r);
   log(B("Thay đổi vai trò","Role changed"),`${acc.u}: ${el.checked?"+":"−"}${r}`,"","admin");render();toast(T("Đã cập nhật vai trò cho ","Roles updated for ")+acc.u);return;}
  if(a==="lock"||a==="unlock"){const acc=S.accounts.find(x=>x.u===v);if(!acc||acc.u===S.user.u)return;acc.active=a==="unlock";if(acc.active)acc.fail=0;log(a==="lock"?B("Khóa tài khoản","Account locked"):B("Mở khóa tài khoản","Account unlocked"),acc.u,"","admin");render();return;}}
});
document.addEventListener("input",e=>{const t=e.target;if(!S.user)return;
 if(t.dataset.vit&&S.view==="intake"){const p=P(S.selN);p.vitals[t.dataset.vit]=t.value;$("#vitcalc").innerHTML=vitCalc(p);return;}
 if(S.view==="scribe"){const p=P(S.selD);if(!p||!inScope(p))return;
  if(t.id==="tr"){p.transcript=t.value;return;}
  if(t.dataset.soap){const [k,j]=t.dataset.soap.split(".");p.soap[k][+j].text=t.value;return;}
  if(t.dataset.icd!=null){p.soap.A[+t.dataset.icd].icd10=t.value.trim().toUpperCase();return;}
  if(t.id==="fbase"){S.fhirBase=t.value.trim();return;}
  if(t.id==="ackr"){p.alertReason=t.value;return;}}
 if(S.view==="ipd"){const n=S.inpatients.find(x=>x.id===S.selIn);if(!wardsOK(n))return;
  if(t.id==="ntnotes"){n.notes=t.value;return;}
  if(t.dataset.nt){const it=ntPath(n,t.dataset.nt);it.obj[it.k].text=t.value;return;}}
 if(t.dataset.cap&&S.view==="ops"){S.cap[t.dataset.cap]=t.dataset.cap==="savedMin"?t.value:(num(t.value)||0);clearTimeout(window._ct);window._ct=setTimeout(()=>{const id=t.dataset.cap;render();const x=document.querySelector(`[data-cap="${id}"]`);if(x){x.focus();x.setSelectionRange(x.value.length,x.value.length);}},500);return;}
});
document.addEventListener("change",e=>{const t=e.target;if(!S.user)return;if(t.id==="fbase"){render();return;}if(t.dataset.icd!=null&&S.view==="scribe"){render();return;}if(t.dataset.a==="aimode"){S.aiMode=t.value;render();return;}
 if(t.dataset.a==="tpl"&&S.view==="scribe"&&t.value){const p=P(S.selD);if(!p||!inScope(p)||p.status==="Đã lưu HIS")return;const k=t.value;p.transcript=SCRIPTS[k]||STRUCT_TPL[k]||"";p.soap=null;if(p.status==="Chờ khám"||p.status==="Chờ duyệt")p.status="Đang khám";log(B("Nạp mẫu test","Test template loaded"),k,p.id);render();const ta=$("#tr");if(ta){ta.focus();if(k==="STRUCT_EMPTY")ta.setSelectionRange(3,3);}toast(T("Đã nạp mẫu. Sửa tùy ý rồi bấm “Tạo bản nháp SOAP”.","Template loaded. Edit as needed, then click “Generate SOAP draft”."));return;}
 if(t.dataset.a==="idle"&&can("users.manage")){S.idleMin=+t.value;S.lastAct=Date.now();log(B("Đổi thời gian tự đăng xuất","Idle timeout changed"),t.value+" min","","admin");render();return;}
 if(t.dataset.vit==="avpu"&&S.view==="intake"){P(S.selN).vitals.avpu=t.value;$("#vitcalc").innerHTML=vitCalc(P(S.selN));}});
function applyVitText(p,text){const o=parseVitals(text);const k=Object.keys(o);if(!k.length){toast(T("Không tách được số liệu. Hãy đọc theo mẫu: mạch 80, huyết áp 120 trên 80…","Could not parse values. Use the pattern: mạch 80, huyết áp 120 trên 80…"));return;}Object.assign(p.vitals,o);log(B("Nhập sinh hiệu bằng câu đọc","Vitals entered by phrase"),k.length+" values",p.id);render();toast(T("Đã điền ","Filled ")+k.length+T(" chỉ số. Kiểm tra lại trước khi lưu."," values. Check before saving."));}
function ntPath(n,path){const s=path.split(".");if(s[0]==="phieu")return {obj:n.result.phieu,k:+s[1]};return {obj:n.result.sbar[s[1]],k:+s[2]};}
function verifyNT(n){const all=[...n.result.phieu,...Object.values(n.result.sbar).flat()];all.forEach(i=>{i.v=i.confirmed?"ok":checkEvidence(i.evidence,n.notes,false);});const bad=all.filter(i=>i.v==="bad").length;if(bad)log(B("Phát hiện dòng không căn cứ","Unsupported lines detected"),String(bad),n.id);}
function playScript(p){const lines=SCRIPTS[p.id].split("\n");p.transcript="";let i=0;S.busy=true;render();const ta=()=>$("#tr");
 const tick=()=>{if(!S.user||S.view!=="scribe"||S.selD!==p.id){S.busy=false;return;}if(i>=lines.length){S.busy=false;render();toast(T("Hội thoại mẫu đã xong. Bấm “Tạo bản nháp SOAP”.","Sample conversation finished. Click “Generate SOAP draft”."));return;}p.transcript+=(p.transcript?"\n":"")+lines[i++];const t=ta();if(t){t.value=p.transcript;t.scrollTop=t.scrollHeight;}setTimeout(tick,420);};tick();}
async function copy(t){try{await navigator.clipboard.writeText(t);toast(T("Đã sao chép.","Copied."));}catch(e){toast(T("Trình duyệt chặn sao chép.","The browser blocked copying."));}}
async function saveFile(name,data){if(!DL&&STANDALONE){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:name.endsWith(".py")?"text/x-python":"application/json"}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);return;}if(!DL){toast(T("Tải file không khả dụng ở chế độ xem này.","Downloads are unavailable in this view."));return;}try{await DL.save({filename:name,data});}catch(e){toast(T("Không tải được: ","Download failed: ")+(e.message||e.code||""));}}

// ===================== Phiên làm việc: tự đăng xuất =====================
["click","keydown","input","pointerdown","wheel","touchstart"].forEach(ev=>document.addEventListener(ev,()=>{if(S.user)S.lastAct=Date.now();},{passive:true,capture:true}));
setInterval(()=>{if(!S.user)return;const left=S.idleMin*60000-(Date.now()-S.lastAct);if(left<=0){logout("timeout");return;}updTimer(left);},1000);

// ===================== Đọc chính tả =====================
let dictUnsub=[];
function toggleDict(target){if(!DICT)return;if(S.dictFor){stopDict().then(render);return;}
 S.dictFor=target;S.partial="";const p=DICT.start();render();Promise.resolve(p).catch(err=>{S.dictFor=null;render();toast(err&&err.code==="not_granted"?T("Không được cấp quyền micro. Hãy dùng hội thoại mẫu hoặc gõ.","Microphone permission denied. Use the sample conversation or type."):T("Không bật được ghi âm: ","Could not start recording: ")+(err&&(err.message||err.code)||""));});}
async function stopDict(){if(!S.dictFor||!DICT){S.dictFor=null;return;}try{await DICT.stop();}catch(e){}S.dictFor=null;S.partial="";}
function onFinal(text){if(!text||!S.user)return;if(S.dictFor==="vit"){const inp=$("#vtext");if(inp){inp.value=(inp.value+" "+text).trim();applyVitText(P(S.selN),inp.value);}}
 else if(S.dictFor==="doc"){const p=P(S.selD);if(!p)return;const refused=p.consent&&p.consent.value==="no";p.transcript+=(p.transcript?"\n":"")+(refused?"BS (tóm tắt): ":S.speaker+": ")+text;const t=$("#tr");if(t){t.value=p.transcript;t.scrollTop=t.scrollHeight;}}
 else if(S.dictFor==="nt"){const n=S.inpatients.find(x=>x.id===S.selIn);n.notes=(n.notes+" "+text).trim();const t=$("#ntnotes");if(t)t.value=n.notes;}
 S.partial="";const pe=document.querySelector(".partial");if(pe)pe.textContent="";}

// ===================== Khởi động =====================
function localDictation(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return null;let rec=null,cbP=()=>{},cbF=()=>{},cbS=()=>{},stopRes=null;
 return {onPartial(f){cbP=f;},onFinal(f){cbF=f;},onState(f){cbS=f;},
  start(){rec=new SR();rec.lang="vi-VN";rec.continuous=true;rec.interimResults=true;
   rec.onresult=ev=>{let interim="";for(let i=ev.resultIndex;i<ev.results.length;i++){const r=ev.results[i];if(r.isFinal)cbF({text:r[0].transcript.trim()});else interim+=r[0].transcript;}cbP({text:interim});};
   return new Promise((res,rej)=>{rec.onstart=()=>{cbS({state:"listening"});res();};rec.onerror=e=>{rej({code:e.error==="not-allowed"?"not_granted":e.error,message:e.error});};rec.onend=()=>{cbS({state:"idle",reason:"stopped"});if(stopRes){stopRes();stopRes=null;}};rec.start();});},
  stop(){return new Promise(res=>{if(!rec)return res();stopRes=res;try{rec.stop();}catch(e){res();}});}};}
document.documentElement.lang=LANG;
render();
if(STANDALONE){DICT=localDictation();if(DICT){DICT.onPartial(({text})=>{S.partial=text;const pe=document.querySelector(".partial");if(pe)pe.textContent=text;});DICT.onFinal(({text})=>onFinal(text));DICT.onState(({state})=>{if(state==="idle"&&S.dictFor){S.dictFor=null;render();}});if(S.user)render();}}
if(window.claude&&window.claude.use){
 claude.use("sample").then(s=>{AI=s;if(S.user)render();}).catch(()=>{});
 claude.use("downloads").then(d=>{DL=d;}).catch(()=>{});
 claude.use("dictation").then(d=>{DICT=d;if(!d)return;d.onPartial(({text})=>{S.partial=text;const pe=document.querySelector(".partial");if(pe)pe.textContent=text;});d.onFinal(({text})=>onFinal(text));d.onState(({state})=>{if(state==="idle"&&S.dictFor){S.dictFor=null;render();}});if(S.user)render();}).catch(()=>{});
}
